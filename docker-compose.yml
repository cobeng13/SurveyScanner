services:
  web:
    build: .
    image: survey-scanner:local
    container_name: survey-scanner-csv
    init: true
    restart: unless-stopped
    ports:
      - "${SURVEY_BIND_ADDRESS:-127.0.0.1}:${SURVEY_HOST_PORT:-8008}:8008"
    environment:
      SURVEY_MAX_UPLOAD_MB: ${SURVEY_MAX_UPLOAD_MB:-500}
      SURVEY_MAX_PAGES: ${SURVEY_MAX_PAGES:-200}
      SURVEY_MAX_RASTER_MP: ${SURVEY_MAX_RASTER_MP:-2800}
      SURVEY_JOB_TIMEOUT: ${SURVEY_JOB_TIMEOUT:-900}
      SURVEY_CONCURRENCY: ${SURVEY_CONCURRENCY:-1}
      SURVEY_PUBLIC_ORIGIN: ${SURVEY_PUBLIC_ORIGIN:-}
      SURVEY_ROOT_PATH: ${SURVEY_ROOT_PATH:-}
